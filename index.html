/* =========================================================
   ÁGORA · modo plenaria (independiente de la autoevaluación)
   No envía nada a la hoja de Google. Guarda solo en este dispositivo
   y permite descargar el resultado de la sesión.
   ========================================================= */
const PLEN_OPC = [
  { i: 0, k: '0', corto: 'No', largo: 'No se hizo', color: 'var(--guinda-claro)' },
  { i: 1, k: '1', corto: 'En parte', largo: 'Se hizo en parte', color: '#c8892f' },
  { i: 2, k: '2', corto: 'Sí', largo: 'Sí se hizo', color: '#4f9a7f' },
  { i: 3, k: '3', corto: 'Sí + evidencia', largo: 'Sí, con evidencia', color: '#2e7a69' },
  { i: 4, k: 'n', corto: 'No sé', largo: 'No lo sé o no participé', color: '#8a948f' }
];
const PL0 = () => ({ fase: 'inicio', plantel: '', proyecto: '', n: '', idx: 0, intro: true, votos: {}, acuerdo: {}, hist: [], pista: false, inicio: null });
let PL = Object.assign(PL0(), store.get('plen', null) || {});
const plGuarda = () => store.set('plen', PL);
const plV = id => PL.votos[id] || [0, 0, 0, 0, 0];
const plTotal = id => plV(id).reduce((a, b) => a + b, 0);

function plMasVotado(id) {                    // índice con más votos; null si hay empate o no hay votos
  const v = plV(id), m = Math.max(...v);
  if (!m) return null;
  const top = v.map((x, i) => x === m ? i : -1).filter(i => i >= 0);
  return top.length === 1 ? top[0] : null;
}
function plEmpate(id) {
  const v = plV(id), m = Math.max(...v);
  return m > 0 && v.filter(x => x === m).length > 1;
}
function plDivision(id) {                     // 'fuerte' | 'moderada' | 'nosabe' | null
  const v = plV(id), t = plTotal(id);
  if (t < 3) return null;
  if (v[4] / t >= .4) return 'nosabe';
  const sig = [0, 1, 2, 3].filter(i => v[i] >= 2 && v[i] / t >= .2);
  if (sig.length < 2) return null;
  return Math.max(...sig) - Math.min(...sig) >= 2 ? 'fuerte' : 'moderada';
}
const plAcuerdoIdx = id => (id in PL.acuerdo) ? PL.acuerdo[id] : plMasVotado(id);
function plResp() {
  const r = {};
  CRITERIOS.forEach(c => { const a = plAcuerdoIdx(c.id); if (a !== null && a !== undefined) r[c.id] = a === 4 ? null : a; });
  return r;
}

function plVotar(i, delta) {
  const c = CRITERIOS[PL.idx], v = [...plV(c.id)];
  if (delta < 0 && v[i] === 0) return;
  v[i] += delta; PL.votos[c.id] = v;
  if (delta > 0) PL.hist.push([c.id, i]);
  plGuarda(); plPintar();
}
function plDeshacer() {
  const h2 = PL.hist.pop(); if (!h2) return;
  const v = [...plV(h2[0])]; if (v[h2[1]] > 0) v[h2[1]]--; PL.votos[h2[0]] = v;
  const k = CRITERIOS.findIndex(c => c.id === h2[0]);
  if (k >= 0 && PL.fase === 'votando') { PL.idx = k; PL.intro = false; }
  plGuarda(); plPintar();
}
function plConfirmar(titulo, texto, etiqueta, fn) {
  const cerrar = () => { m.remove(); document.removeEventListener('keydown', esc, true); };
  const esc = e => { if (e.key === 'Escape') { e.stopPropagation(); cerrar(); } };
  const m = h('div', { class: 'plen-modal', role: 'dialog', 'aria-modal': 'true', onclick: e => { if (e.target === m) cerrar(); } },
    h('div', { class: 'plen-modal-c' }, h('h3', {}, titulo), h('p', {}, texto),
      h('div', { class: 'plen-modal-b' },
        h('button', { class: 'btn borde', onclick: cerrar }, 'Cancelar'),
        h('button', { class: 'btn oro', onclick: () => { cerrar(); fn(); } }, etiqueta))));
  document.addEventListener('keydown', esc, true); document.body.append(m);
}
function plLimpiarCriterio() {
  const c = CRITERIOS[PL.idx]; if (plTotal(c.id) === 0 && !(c.id in PL.acuerdo)) return;
  plConfirmar('¿Limpiar los votos de ' + c.id + '?', 'Se borrarán todos los votos de este criterio y el acuerdo fijado en él, para que puedan contarse de nuevo. Los demás criterios no se tocan.', 'Sí, limpiar votos', () => {
    PL.votos[c.id] = [0, 0, 0, 0, 0]; delete PL.acuerdo[c.id]; PL.hist = PL.hist.filter(x => x[0] !== c.id);
    plGuarda(); plPintar();
  });
}
function plReiniciar() {
  plConfirmar('¿Reiniciar el ejercicio?', 'El ejercicio comenzará de nuevo: se perderán todos los votos y acuerdos capturados hasta ahora y volverás a la portada de la plenaria.', 'Sí, reiniciar', () => {
    PL = PL0(); plGuarda(); plPintar(); window.scrollTo({ top: 0 });
  });
}
const plNPres = () => Math.max(0, parseInt(PL.n, 10) || 0);
// razón por la que no se puede avanzar: 'faltan' | 'sobran' | 'empate' | null
function plBloqueo() {
  if (PL.fase !== 'votando' || PL.intro) return null;
  const id = CRITERIOS[PL.idx].id, n = plNPres(), t = plTotal(id);
  if (n) { if (t < n) return 'faltan'; if (t > n) return 'sobran'; }
  if (plEmpate(id) && !(id in PL.acuerdo)) return 'empate';
  return null;
}
const plEmpatePend = () => plBloqueo() !== null;
function plIr(n) {
  if (n < 0) return;
  if (n > PL.idx && plBloqueo()) { const r = plBloqueo(); if (r === 'empate') toast('Hay empate: elige el voto de calidad para continuar.'); else if (r === 'sobran') toast('Hay más votos que personas presentes: corrige el conteo.'); return; }
  if (n >= CRITERIOS.length) { PL.fase = 'resultado'; plGuarda(); return plPintar(); }
  const nueva = DIMENSIONES.findIndex(d => d.id === CRITERIOS[n].d), vieja = DIMENSIONES.findIndex(d => d.id === CRITERIOS[PL.idx].d);
  PL.intro = n > PL.idx && nueva !== vieja;
  PL.idx = n; PL.pista = false; plGuarda(); plPintar();
}

function vPlenaria() {
  const v = h('div', { class: 'plen', id: 'plen' });
  setTimeout(plPintar, 0);
  return v;
}
function plPintar() {
  const raiz = $('#plen'); if (!raiz) return;
  raiz.innerHTML = '';
  raiz.append(PL.fase === 'inicio' ? plInicio() : PL.fase === 'resultado' ? plResultado() : plVotando(), creditoPantalla());

/* ---------- Inicio ---------- */
function plInicio() {
  const hayAvance = Object.keys(PL.votos).length > 0;
  return h('div', { class: 'plen-centro' },
    h('span', { class: 'kicker' }, 'Sesión colegiada'),

    h('p', { class: 'plen-lead' }, 'Evalúen juntos un proyecto, criterio por criterio. Cada persona vota en silencio y a la vez; tú cuentas los votos, miran cómo se distribuyen y dialogan donde haya división.'),
    h('div', { class: 'plen-form' },
      h('label', {}, h('span', {}, 'Plantel (opcional)'), h('select', { class: 'sel', onchange: e => { PL.plantel = e.target.value; plGuarda(); } },

      h('label', {}, h('span', {}, 'Personas presentes (opcional)'), h('input', { class: 'txt', type: 'number', min: 1, max: 200, value: PL.n, placeholder: 'Para vigilar el conteo', oninput: e => { PL.n = e.target.value; plGuarda(); } }))),
    h('div', { class: 'cta-fila' },
      h('button', { class: 'btn oro', onclick: () => { Object.assign(PL, { fase: 'votando', idx: 0, intro: true, inicio: PL.inicio || new Date().toISOString() }); plGuarda(); plPintar(); } },
        hayAvance ? 'Ir al primer criterio' : 'Comenzar', h('span', { html: ICONO.flecha })),
      hayAvance ? h('button', { class: 'btn borde', onclick: () => { PL.fase = 'votando'; plGuarda(); plPintar(); } }, 'Reanudar sesión') : null,
      hayAvance ? h('button', { class: 'btn borde', onclick: () => plConfirmar('¿Borrar la sesión?', 'Se perderán los votos y acuerdos capturados.', 'Sí, borrar', () => { PL = PL0(); plGuarda(); plPintar(); }) }, 'Borrar sesión') : null),
    h('p', { class: 'plen-nota' }, 'Esta pantalla no envía nada a la hoja de Google. Lo que captures se guarda solo en este dispositivo y puedes descargar el resultado al final. Atajos: teclas 0, 1, 2, 3 y N suman un voto; Z deshace; ← y → navegan; P muestra el significado.'));
}

/* ---------- Votación ---------- */
function plVotando() {
  const c = CRITERIOS[PL.idx];
  const d = DIMENSIONES.find(x => x.id === c.d);
  const raiz = h('div', { class: 'plen-votando' });
  // barra superior
  const puntos = CRITERIOS.map((k, i) => {
    const hay = plTotal(k.id) > 0;
    return h('button', { class: 'pt' + (i === PL.idx ? ' act' : '') + (hay ? ' hay' : ''), title: k.id, onclick: () => plIr(i) });
  });

    h('div', { class: 'plen-dim' }, h('b', {}, d.id), h('span', {}, d.nombre), h('em', {}, d.propo ? PROPOSITOS_PAEC[d.propo] : PROPOSITOS_PAEC[0])),

      h('button', { class: 'btn borde peq', disabled: plEmpatePend(), onclick: () => { PL.fase = 'resultado'; plGuarda(); plPintar(); } }, 'Ver resultado'),
      h('button', { class: 'btn borde peq', onclick: plReiniciar }, 'Reiniciar ejercicio'))));

  if (n && tot > n) avisos.push(['alerta', `Hay ${tot} votos y solo ${n} personas presentes: quita ${tot - n} voto(s) para poder continuar.`]);
  if (emp && plBloqueo() === 'empate') avisos.push(['emp', 'Hay empate: se requiere el voto de calidad. Elige una opción del acuerdo de la plenaria para poder continuar.']);

  raiz.append(h('div', { class: 'plen-crit' },
    h('div', { class: 'plen-id' }, c.id, h('em', {}, `Criterio ${PL.idx + 1} de ${CRITERIOS.length} · paso ${c.paso} de la ruta`)),
    h('h2', { class: 'plen-t' }, c.t),
    h('button', { class: 'plen-ayuda', onclick: () => { PL.pista = !PL.pista; plGuarda(); plPintar(); } }, PL.pista ? 'Ocultar significado' : '¿Qué significa? (P)'),
    PL.pista ? h('div', { class: 'plen-pista' }, c.pista, h('small', {}, c.f)) : null));

const nomPlen = id => (PLANTELES.find(p => p.id === id) || { nombre: id }).nombre;
function plDescargar() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const filas = [['sesion', PL.inicio || '', 'plantel', PL.plantel, 'proyecto', PL.proyecto, 'personas', PL.n].map(q).join(','),

/* Atajos de teclado (solo cuando la plenaria está a la vista) */
document.addEventListener('keydown', e => {
  if (location.hash !== '#/plenaria' || !$('#plen') || e.target.matches('input,textarea,select') || e.ctrlKey || e.metaKey) return;
  if (PL.fase !== 'votando') return;
  const k = e.key.toLowerCase();
  if (PL.intro) { if (k === 'enter' || k === ' ' || k === 'arrowright') { e.preventDefault(); PL.intro = false; plGuarda(); plPintar(); } return; }
  const o = PLEN_OPC.find(x => x.k === k);
  if (o) { e.preventDefault(); plVotar(o.i, +1); }
  else if (k === 'z') plDeshacer();
  else if (k === 'arrowright') plIr(PL.idx + 1);
  else if (k === 'arrowleft') plIr(PL.idx - 1);
  else if (k === 'p') { PL.pista = !PL.pista; plGuarda(); plPintar(); }
});

function cadenaInteractiva() {

  CADENA.forEach((c, i) => {
    const btn = h('button', { class: 'nodo-c ' + c.k, type: 'button', 'aria-expanded': 'false', 'aria-controls': 'cad' + i, onclick: () => abrir(i) },
      h('b', {}, c.t), h('span', {}, c.s), h('i', { class: 'mas-c', 'aria-hidden': 'true' }));
    const panel = h('div', { class: 'cad-panel c-' + c.k, id: 'cad' + i, role: 'region' }, h('div', { class: 'cad-in' },
      h('p', { class: 'cad-def' }, c.def),

      h('p', { class: 'fuente' }, c.fte)));
    botones.push(btn); paneles.push(panel);
    el.append(btn, panel);
    if (i < CADENA.length - 1) el.append(h('div', { class: 'flecha-c', 'aria-hidden': 'true' }, '↓'));
  });

}

/* =========================================================
   ÁGORA · Planificador · varios proyectos y respaldo en la nube (Fase 1)
   - Cada proyecto se guarda en este dispositivo (PLANES) y, si el plantel activó el respaldo con su clave, también en la hoja Planes.
   - NUBE[id] = { rev, mod }: versión de la nube que este dispositivo conoce y la marca de edición que se envió.
   ========================================================= */
const PLAN_ESTADOS = ['Borrador', 'Listo para revisión', 'Revisado'];
const PLAN_MAX = 45000;
let NUBE = store.get('plan_nube', {});
let CLAVES = store.get('plan_claves', {});
let planBarraAbierta = false;
let planTimer = null, planEnviando = false, planNubeMsg = null;
const planNubeGuarda = () => { store.set('plan_nube', NUBE); store.set('plan_claves', CLAVES); };
const planVacio = p => !(p.plantel && (p.nombre || '').trim());

/* ----- resumen que se envía con cada copia (alimenta el tablero del supervisor) ----- */
function planResumenDe(p) {
  const keep = PLAN; PLAN = p;
  try {
    const cs = planChecks();
    const pasos = [0, 1, 2, 3, 4, 5].map(i => { const l = cs.filter(c => c.paso === i); return l.length && l.every(c => c.c) ? 'S' : 'N'; }).join('');
    return { pasos, checks: cs.filter(c => c.c).length, checksTotal: cs.length, asignaturas: planAsigsOk(), actividades: p.acts.length };
  } finally { PLAN = keep; }
}
const planSucia = id => { const p = PLANES[id]; return !!p && !planVacio(p) && !!CLAVES[p.plantel] && (!NUBE[id] || NUBE[id].mod !== p.mod); };

/* ----- estado que se muestra ----- */
function planNubeEstado() {
  const p = PLAN, k = CLAVES[p.plantel];
  if (!CONFIG.ENDPOINT) return { k: 'sin', t: 'La nube no está configurada.' };
  if (!p.plantel) return { k: 'sin', t: 'Elige tu plantel para poder activar el respaldo en la nube.' };
  if (!k) return { k: 'sin', t: 'Solo en este dispositivo. Activa el respaldo con la clave de tu plantel.' };
  if (planEnviando) return { k: 'env', t: 'Guardando en la nube…' };
  if (planNubeMsg && planNubeMsg.id === p.id) return planNubeMsg;
  if (planVacio(p)) return { k: 'sin', t: 'Pon un nombre al proyecto para que se respalde en la nube.' };
  if (planSucia(p.id)) return { k: 'pend', t: 'Cambios por enviar a la nube…' };
  return { k: 'ok', t: 'Guardado en la nube · revisión ' + NUBE[p.id].rev };
}
function planNubeUI() {
  const e = $('#pl-nube'); if (!e) return;
  const s = planNubeEstado();
  e.className = 'pl-nube ' + s.k; e.textContent = { sin: 'Solo en este dispositivo', env: 'Guardando en la nube…', pend: 'Cambios por enviar', ok: 'Guardado en la nube', off: 'Sin conexión', err: 'Requiere tu atención' }[s.k]; e.title = s.t;
  const t = $('.pl-nube-t'); if (t) t.textContent = s.t;
  const b = $('#pl-nube-btn'); if (b) b.textContent = CLAVES[PLAN.plantel] ? 'Guardar en la nube ahora' : 'Activar respaldo en la nube';
}

/* ----- envío ----- */
function planNubeAgenda() {
  if (!CONFIG.ENDPOINT) return;
  clearTimeout(planTimer);
  if (Object.keys(PLANES).some(planSucia)) planTimer = setTimeout(() => planNubeTodo(), 8000);
  planNubeUI();
}
const planErrTxt = e => ({ clave: 'La clave del plantel no es correcta.', bloqueado: 'Demasiados intentos con clave incorrecta. Espera unos minutos.', tamano: 'El proyecto es demasiado extenso para la nube.', estado: 'Ese estado solo lo asigna el supervisor.', plantel: 'El plantel no coincide con el del proyecto en la nube.' }[e] || 'No se pudo guardar en la nube.');
async function planNubeTodo(soloId, incluir, forzar) {        // incluir: enviar aunque no haya cambios · forzar: true (pisar la nube) o 'nuevo' (volver a crearlo)
  if (planEnviando) { planTimer = setTimeout(() => planNubeTodo(soloId, incluir, forzar), 3000); return; }
  const ids = (soloId ? [soloId] : Object.keys(PLANES)).filter(id => incluir || planSucia(id));
  if (!ids.length) { planNubeUI(); return; }
  planEnviando = true; planNubeUI();
  for (const id of ids) {
    const p = planNormaliza(PLANES[id]); if (!p) continue;
    const mod = p.mod, k = CLAVES[p.plantel]; if (!k || planVacio(p)) continue;
    if (JSON.stringify(p).length > PLAN_MAX) { planNubeMsg = { id, k: 'err', t: 'El proyecto es demasiado extenso para la nube (reduce textos o divídelo en dos).' }; continue; }
    try {
      const r = await postJSON({ accion: 'plan_guardar', plantel: p.plantel, clavePlantel: k, plan: p, estado: p.estado === 'Revisado' ? 'Revisado' : p.estado, revBase: forzar === 'nuevo' ? 0 : (NUBE[id] ? NUBE[id].rev : 0), forzar: !!forzar, resumen: planResumenDe(p) });
      NUBE[id] = { rev: r.rev, mod }; if (planNubeMsg && planNubeMsg.id === id) planNubeMsg = null;
      if (soloId) toast('Guardado en la nube.');
    } catch (e) {
      const m = String(e.message || '');
      if (m === 'conflicto' || m === 'noexiste') { planNubeMsg = { id, k: 'err', t: 'Hay otra versión en la nube. Resuélvelo para seguir respaldando.' }; planNubeGuarda(); planEnviando = false; planConflicto(id, m); planEnviando = true; }
      else if (m === 'clave' || m === 'bloqueado') { if (m === 'clave') delete CLAVES[p.plantel]; planNubeMsg = { id, k: 'err', t: planErrTxt(m) + ' Vuelve a activar el respaldo.' }; }
      else if (['tamano', 'estado', 'plantel', 'plan'].includes(m)) planNubeMsg = { id, k: 'err', t: planErrTxt(m) };
      else planNubeMsg = { id, k: 'off', t: 'Sin conexión: se enviará cuando vuelva. Tu avance está a salvo en este dispositivo.' };
      if (soloId) toast(planNubeMsg.t);
    }
  }
  planEnviando = false; planNubeGuarda(); planNubeUI();
  if (Object.keys(PLANES).some(planSucia)) { clearTimeout(planTimer); planTimer = setTimeout(() => planNubeTodo(), 60000); }
}

  marcarNav(hash); observaRev(cont);
  if (hash !== '#/evaluar') window.scrollTo(0, 0);
  document.body.classList.toggle('modo-plen', hash === '#/plenaria');
}
window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', () => {
  montarNav('#/');
  document.body.append(h('main', { id: 'vista' }));
  render();
  cola.flush().then(r => { if (r.enviados) toast(r.enviados + ' respuesta(s) pendiente(s) enviada(s).'); actualizarEstado(); });
  window.addEventListener('online', () => cola.flush().then(actualizarEstado));
});

</script></body></html>
